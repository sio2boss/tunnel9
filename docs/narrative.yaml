---
title: tunnel9 Narrative

definitions:
  name: Definitions
  description: >
    Descriptions of terms used within this file and their meaning or desired interpretation.
  value:

    - name: "App"
      value: >
        When we refer to this project by the name App, we imply this entire functionality
        as manifested within the current git repository.  By default every concept is
        connected to the App unless specifically tied to another concept.

    - name: "Status"
      description: >
        The status of a feature or component.
      value:
        - name: 'idea'
          value: 'An idea for a feature or component'
        - name: 'in-progress'
          value: 'A feature or component that is being worked on'
        - name: 'partial'
          value: 'A feature or component that is partially complete'
        - name: 'review'
          value: 'A feature or component that is being reviewed by the user'
        - name: 'done'
          value: 'A feature or component that is complete'

    - name: "Framework"
      value: >
        A collection of software that is a dependency of an [[App]].

    - name: "Module"
      value: >
        A non-visual component of the application that serves as an organizational
        block of code and functionality.

    - name: "Subsystem"
      value: >
        A sufficiently large collection of logic and functionality that it needs to be
        separately managed. Generally a collection of [[Module]] elements.

    - name: "Service"
      value: >
        A networked piece of logic which might consist of multiple [[Subsystem]] and/or [[Module]] elements.
        Services interact with external systems, APIs, or network resources.

    - name: "Component"
      value: >
        A user interface element that encapsulates display and interaction logic.
        Can be a web/HTML component, a React component, or a TUI component.

    - name: "Screen"
      value: >
        A full user-visible view composed of [[Component]] elements, such as a web page
        or a TUI screen/state.

    - name: "Page"
      value: >
        A screen shown to the user, composed of [[Component]] elements. An existing
        concept from the selected [[Framework]].

    - name: "DataModel"
      value: >
        The shape of data managed by the [[App]], manifested as a struct or interface.
        The singular unit transferring data between [[Module]], [[Component]], 
        [[Subsystem]] or any other part of a software product.

    - name: "Storage"
      value: >
        The persistent capture of [[DataModel]], generally a database. Usually a [[Subsystem]].

    - name: "State"
      value: >
        The in-memory representation of [[DataModel]], sometimes also persisted via [[Storage]].

    - name: "Feature"
      value: >
        A core operation, presentation, or behavior of the [[App]] that is essential to the user's experience.

    - name: "Flourish"
      value: >
        A decorative or ergonomic enhancement layered on top of a [[Feature]]. Not required for core
        function — the underlying [[Feature]] is always accessible without it.


general:
  name: General
  description: 'General information about the product'
  value:

    - name: 'Name'
      value: 'tunnel9'
      description: 'The product name used for branding and identification'

    - name: 'Description'
      value: 'A terminal user interface (TUI) for managing SSH tunnels. Tunnel9 provides a simple, efficient way to manage multiple SSH port forwarding configurations with real-time monitoring of throughput and latency.'
      description: 'Concise explanation of the product and its primary purpose'

    - name: 'Motivation'
      value: >
        tunnel9 exists because manual SSH tunnel commands are painful to remember and difficult
        to maintain on a per-project basis.
      description: 'The core reason this product exists'

    - name: 'Target Audience'
      value: 'Software Developers'
      description: 'Primary user segments the product is designed to serve'


